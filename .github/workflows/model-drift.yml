name: Model catalog drift

# Compares every hosted catalog with models.dev once a day. A disagreement not
# yet triaged opens (or refreshes) one issue; when none remain, that issue is
# closed. models.dev is a drift detector, not a source of truth: the issue asks
# a person to reopen the vendor page each row cites.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: model-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Compare catalogs with models.dev
    # Forks would each open their own issue for the same drift.
    if: github.repository == 'rekursiv-ai/sagent'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Check drift and file the result
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Model catalog drift
        run: |
          set +e
          uv run --frozen python -m sagent.bin.verify_models --drift --report drift.md
          status=$?
          set -e
          # pipefail: a failed `gh issue list` must fail the step, not read as
          # "no open issue" and create a duplicate.
          set -o pipefail
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number,title \
            --jq "[.[] | select(.title == env.TITLE)] | .[0].number // \"\"")"
          if [ -f drift.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file drift.md
            else
              gh issue create --title "$TITLE" --body-file drift.md
            fi
          elif [ "$status" -eq 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "No untriaged drift as of $(date -u +%F)."
            fi
          else
            # No report means models.dev was unreadable or the offline audit
            # failed: a broken check, not drift, so fail the run instead.
            echo "::error::drift check failed before producing a report"
            exit "$status"
          fi
